<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Badges</h2>
  <h1>Example heading <span class="badge rounded-pill bg-primary">Hello World !</span></h1>
  <h2>Example heading <span class="badge rounded-pill bg-secondary">Hello World !</span></h2>
  <h3>Example heading <span class="badge rounded-pill bg-dark">Hello World !</span></h3>
  <h4>Example heading <span class="badge rounded-pill bg-danger">Hello World !</span></h4>
  <h5>Example heading <span class="badge rounded-pill bg-warning">Hello World !</span></h5>
  <h6>Example heading <span class="badge rounded-pill bg-info">Hello World !</span></h6>
</div>

</body>
</html>
